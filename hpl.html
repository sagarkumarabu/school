<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPL Sheet Cutting Calculator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
         line-height: 1.6; padding: 20px; max-width: 900px; margin: auto; background: #f0f2f5; }
        .container { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: #1a73e8; text-align: center; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .input-group { display: flex; flex-direction: column; }
        label { margin-bottom: 8px; font-weight: 600; color: #444; }
        select, input { padding: 12px; border: 1.5px solid #ddd; 
        border-radius: 6px; font-size: 16px; outline: none; transition: border 0.3s; }
        select:focus, input:focus { border-color: #1a73e8; }
        button { background: #1a73e8; color: white; border: none;
         padding: 15px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 18px; font-weight: bold; margin-top: 10px; }
        button:hover { background: #1557b0; }
        .result-box { margin-top: 25px; padding: 20px; background: #f8f9fa; border-left: 5px solid #1a73e8; border-radius: 4px; display: none; }
        canvas { border: 2px solid #333; margin-top: 30px; width: 100%; background: #fff; border-radius: 4px; }
        .legend { display: flex; gap: 20px; margin-top: 15px; font-weight: 500; justify-content: center; }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .box { width: 20px; height: 20px; border-radius: 3px; }
        .b-cut { background: #4285f4; } .b-waste { background: #ea4335; }
        /* Mobile adjustments */
@media (max-width: 600px) {
    body {
        padding: 10px;
    }
    .container {
        padding: 15px;
    }
    .grid {
        grid-template-columns: 1fr; /* Stack inputs vertically */
        gap: 15px;
    }
    h1 {
        font-size: 1.5rem;
    }
    .legend {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
    }
}

    </style>
</head>
<body>

<div class="container">
    <h1>HPL Cutting Planner</h1>
    
    <div class="grid">
        <div class="input-group">
            <label>Sheet Size (Feet)</label>
            <select id="sheetSize">
                <option value="12,6">12 x 6 Feet</option>
                <option value="14,6">14 x 6 Feet</option>
            </select>
        </div>
        <div class="input-group">
            <label>Cut Width (Feet)</label>
            <input type="number" id="cutWidth" placeholder="Width" step="0.01">
        </div>
        <div class="input-group">
            <label>Cut Height (Feet)</label>
            <input type="number" id="cutHeight" placeholder="Height" step="0.01">
        </div>
        <div class="input-group" style="justify-content: flex-end;">
            <button onclick="calculate()">Calculate Now</button>
        </div>
    </div>

    <div id="results" class="result-box">
        <div><strong>Total Sheet Area:</strong> <span id="totalArea"></span> sq.ft</div>
        <div><strong>Required Cut Area:</strong> <span id="usedArea"></span> sq.ft</div>
        <div style="color: #d93025;"><strong>Waste Generated:</strong> <span id="wasteArea"></span> sq.ft</div>
        <hr>
        <div><strong>Remaining Material:</strong> <span id="remDim"></span></div>
    </div>

    <div class="legend" id="legend" style="display:none;">
        <div class="legend-item"><div class="box b-cut"></div> Cut Piece</div>
        <div class="legend-item"><div class="box b-waste"></div> Waste Area</div>
    </div>
    <canvas id="sheetCanvas"></canvas>
</div>

<script>
function calculate() {
    const sheetVal = document.getElementById('sheetSize').value.split(',');
    const SW = parseFloat(sheetVal[0]);
    const SH = parseFloat(sheetVal[1]);
    const CW = parseFloat(document.getElementById('cutWidth').value);
    const CH = parseFloat(document.getElementById('cutHeight').value);

    if (!CW || !CH || CW > SW || CH > SH) {
        alert("Dimensions must be within sheet size limits.");
        return;
    }

    // Calculations
    const totalArea = SW * SH;
    const usedArea = CW * CH;
    const wasteArea = totalArea - usedArea;
    
    // Result Text
    document.getElementById('results').style.display = 'block';
    document.getElementById('legend').style.display = 'flex';
    document.getElementById('totalArea').innerText = totalArea.toFixed(2);
    document.getElementById('usedArea').innerText = usedArea.toFixed(2);
    document.getElementById('wasteArea').innerText = wasteArea.toFixed(2);
    
    // Show remainders in L-shape logic
    const remW = (SW - CW).toFixed(2);
    const remH = (SH - CH).toFixed(2);
    document.getElementById('remDim').innerText = `${remW}ft x ${SH}ft (Side) and ${CW}ft x ${remH}ft (Top)`;

    // Drawing
    const canvas = document.getElementById('sheetCanvas');
    const ctx = canvas.getContext('2d');
    const scale = 50; 
    
    canvas.width = SW * scale;
    canvas.height = SH * scale;

    // Background (Waste)
    ctx.fillStyle = "#ea4335";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Cut (Blue)
    ctx.fillStyle = "#4285f4";
    ctx.fillRect(0, 0, CW * scale, CH * scale);
    
    // Grid/Outline
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.strokeRect(0, 0, CW * scale, CH * scale);

    // Label on cut
    ctx.fillStyle = "white";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText(`${CW}' x ${CH}'`, 10, 25);
}
</script>
</body>
</html>
